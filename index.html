$('#clearGear').onclick=()=>{home.outfit='casual';home.lastDaily='casual';home.lastMagic='magic';home.wand='bare';home.transform='none';home.pet='none';saveHome();renderHome();setHomeMessage('착용한 의상과 장비를 모두 해제했어요.')};
$('#nova').onclick=()=>novaSay(['내가 현역이던 시절엔 마법봉도 직접 깎았지.','루미는 보기보다 눈치가 빠른 아이란다.','귀환석 파편은 다섯 조각을 모아야 한단다.','귀환석 파편에 관한 소문이라면… 더 강해진 뒤 다시 물어보렴.'][Math.floor(Math.random()*4)]);
$('#pet').onclick=()=>{let p=$('#pet'),pet=PETS.find(x=>x.id===home.pet),name=pet?.name.split(' ').pop()||'펫',lines=[`${name}가 쪼르르 달려왔어요!`,`${name}의 장식이 반짝였어요.`,`${name}가 반갑게 몸을 흔들었어요.`];p.classList.remove('happy');void p.offsetWidth;p.classList.add('happy');$('#homeMessage').textContent=lines[Math.floor(Math.random()*lines.length)]};
$('#newGame').onclick=()=>{show('difficulty');renderStageMap()};$('#toTitle').onclick=()=>show('title');$('#notes').onclick=()=>{if(!canEditPuzzle())return;state.noteMode=!state.noteMode;render();save()};$('#erase').onclick=erase;$('#undo').onclick=undo;$('#hint').onclick=hint;$('#pause').onclick=()=>pause(true);$('#continue').onclick=()=>pause(false);$('#restart').onclick=()=>{if(confirm('현재 진행을 지우고 처음부터 다시 시작할까요?'))newPuzzle(state.stage||1)};$('#quit').onclick=()=>{pause(false);show('title');stopClock()};$('#again').onclick=()=>{$('#resultModal').classList.remove('show');openHome()};$('#resultTitle').onclick=()=>{$('#resultModal').classList.remove('show');show('title')};
$('#battleBack').onclick=()=>{show('difficulty');renderStageMap()};$('#wandAttack').onclick=wandAttack;$('#transformAttack').onclick=transformAttack;$('#petSupport').onclick=petSupport;$('#battleRetry').onclick=()=>startBoss(battleState?.stage||10);
let recordsButton=$('#records');if(recordsButton)recordsButton.onclick=()=>{home=loadHome();let r=getRecords(),list=ranking(),shards=returnShards(),done=home.rewarded.length;$('#returnProgress').innerHTML=`<b>귀환석 파편</b><div class="shards">${'◆'.repeat(shards)}${'◇'.repeat(5-shards)}</div>${shards===5?'귀환석 완성! 지구 생활을 계속할지 선택할 수 있어요.':`다음 조각까지 ${3-(done%3)}판 · 총 ${Math.min(done,15)}/15판`}`;$('#recordList').innerHTML=['easy','medium','hard'].map(k=>`${LEVELS[k].ko}: ${r[k]?`최고 ${timeText(r[k].best)} · ${r[k].completed}회 완성`:'아직 기록 없음'}`).join('<br><br>');$('#recordsModal').classList.add('show')};$('#closeRecords').onclick=()=>$('#recordsModal').classList.remove('show');
document.addEventListener('keydown',e=>{if(state.screen!=='game'||$('#resultModal').classList.contains('show'))return;if(e.key==='Escape'){pause(!state.paused);return}if(state.paused||state.complete)return;if(/^[1-9]$/.test(e.key)){input(+e.key);return}if(['Backspace','Delete','0'].includes(e.key)){e.preventDefault();erase();return}if(e.key.toLowerCase()==='n'||e.code==='Space'){e.preventDefault();state.noteMode=!state.noteMode;render();save();return}if(e.key.toLowerCase()==='z'){e.preventDefault();undo();return}let d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-9,ArrowDown:9}[e.key];if(d){e.preventDefault();if(state.selected<0){select(0);return}let i=state.selected+d;if(i>=0&&i<81&&(d===9||d===-9||Math.floor(i/9)===Math.floor(state.selected/9)))select(i)}});
syncResume();
})();
</script>
</body></html>
