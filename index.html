<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#251a48">
<title>SUDOKU X OATAKU</title>
<link rel="stylesheet" href="css/game.css">

</head>
<body>
<div class="grain"></div>
<section id="title" class="screen title active">
  <div><h1 class="bigTitle otaku-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="SUDOKU X OATAKU"><defs><linearGradient id="otakuGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6f5e9"/><stop offset=".5" stop-color="#c9b2ff"/><stop offset="1" stop-color="#ffaddd"/></linearGradient></defs><g fill="none" stroke="url(#otakuGradient)" stroke-width="2" opacity=".65"><path d="M80 40h-35v35M400 40h35v35M80 260h-35v-35M400 260h35v-35"/><path d="m74 128 4 13 13 4-13 4-4 13-4-13-13-4 13-4zm331 23 3 10 10 3-10 3-3 10-3-10-10-3 10-3z"/></g><g font-family="Arial,sans-serif" font-weight="900" text-anchor="middle"><text x="240" y="109" fill="#fff7ff" font-size="66" letter-spacing="5">SUDOKU</text><text x="240" y="240" fill="url(#otakuGradient)" font-size="62" letter-spacing="5">OATAKU</text></g><g stroke="#ffb9e5" stroke-width="7" stroke-linecap="round"><path d="m226 144 28 28m0-28-28 28"/></g><path d="M155 158h43m84 0h43" stroke="url(#otakuGradient)" stroke-width="1.5" opacity=".65"/></svg></h1>
  <div class="title-actions"><button id="newGame" class="btn primary">퍼즐 시작</button><button id="myHome" class="btn">내 방으로 가기</button><button id="openShop" class="btn">상점</button><button id="developerMode" class="btn dev-button">개발자 전용</button></div></div>
</section>
<section id="home" class="screen home"><main class="home-shell">
  <header class="homebar"><button id="homeTitle" class="icon-btn" aria-label="타이틀로">←</button><div class="wallet">POINTS <span id="coins">0</span></div></header>
  <div id="room" class="room"><div class="window"></div><div class="room-title">MY ROOM</div><div id="placed"></div><img id="cat" class="cat" src="assets/modern-woman.png" alt="주인공 루나"><span id="wandDisplay" class="wand-display"></span><span id="transformDisplay" class="transform-display" hidden></span><button id="pet" class="pet" aria-label="펫 쓰다듬기"><span id="petName" class="pet-name">루미</span><img id="petImage" src="assets/pet-lumi.png" alt="선택한 펫"></button><div id="roomGrid" class="room-grid"></div></div>
  <div id="homeMessage" class="home-message" aria-live="polite"></div>
  <div id="roomInventory" class="room-inventory" hidden><strong>가구</strong><div id="ownedTools" class="owned-tools"></div></div>
  <div id="gearCloset" class="gear-closet" hidden><div class="closet-head"><strong>루나의 옷장</strong></div><section class="belongings" aria-labelledby="belongingsTitle"><div id="belongingsTitle" class="closet-label">소지품</div><div class="belongings-list"><article class="belonging-card"><span class="return-shard-icon" aria-hidden="true"><i></i></span><span class="belonging-info"><strong>귀환석 파편</strong></span><b id="homeShards">0 / 5</b></article></div></section><div class="closet-label">의상</div><div id="ownedOutfits" class="closet-row"></div><div class="closet-label">마법봉</div><div id="ownedWands" class="closet-row"></div><div class="closet-label">변신 아이템</div><div id="ownedTransforms" class="closet-row"></div><div class="closet-label">펫</div><div id="ownedPets" class="closet-row"></div></div>
  <div class="home-actions"><button id="quickTransform" class="btn">✦ 변신하기</button><button id="openCloset" class="btn">옷장</button><button id="decorate" class="btn">방 꾸미기</button></div>
</main></section>
<section id="shop" class="screen difficulty"><main class="choice-wrap"><header class="homebar"><button id="shopTitle" class="icon-btn" aria-label="메인 메뉴로">←</button><div class="wallet">POINTS <span id="shopCoins">0</span></div></header><div class="shopkeeper"><button id="nova" aria-label="상점주인 노바 아저씨와 대화"><img src="assets/shopkeeper-nova.png" alt="상점주인 노바 아저씨"></button><div id="novaTalk" class="npc-talk"><strong>노바 아저씨</strong>처음 보는 견습생이구나. 필요한 걸 골라봐.</div></div><div class="fitting-room shop-fitting-fixed"><div class="fitting-stage"><img id="fittingImage" src="assets/modern-woman.png" alt="상품을 미리 확인하는 루나"><span id="fittingWand" class="fitting-wand" hidden></span><span id="fittingTransform" class="fitting-transform" hidden></span><img id="fittingPet" class="fitting-pet" alt="미리 보는 펫" hidden></div><div class="fitting-info" hidden><strong id="fittingName"></strong><small id="fittingStatus"></small><button id="fittingAction" class="fitting-action" hidden></button></div></div><div class="drawer"><div class="drawer-head"><h3>의상</h3><div id="dailyWardrobe" class="wardrobe" aria-label="일상 의상 무료 입어보기"></div></div><div class="shop-section"><h3>마법소녀 의상</h3><div id="magicWardrobe" class="wardrobe" aria-label="마법소녀 의상 무료 입어보기"></div></div><div class="shop-section"><h3>마법봉</h3><div id="wandCatalog" class="mini-catalog"></div></div><div class="shop-section"><h3>변신 아이템</h3><div id="transformCatalog" class="mini-catalog"></div></div><div class="shop-section"><h3>펫</h3><div id="petCatalog" class="mini-catalog"></div></div><div class="shop-section"><h3>가구</h3><div id="catalog" class="catalog"></div></div></div></main></section>
<section id="difficulty" class="screen stage-screen"><main class="stage-shell"><header class="stage-head"><button class="icon-btn" id="toTitle" aria-label="처음으로">←</button><span></span></header><div id="stageMap" class="stage-map"><div id="stageGrid" class="stage-grid"></div></div></main></section>
<section id="battle" class="screen battle"><main class="battle-shell"><header class="battle-head"><button id="battleBack" class="icon-btn" aria-label="의뢰 지도로">←</button><h2 id="battleTitle">번외 보스전</h2><span></span></header><div class="battle-arena"><div id="bossName" class="boss-name"></div><div class="hp-panel boss-hp"><b>BOSS</b><div class="hp-track"><span id="bossHpFill" class="hp-fill"></span></div><span id="bossHpText"></span></div><div id="bossSprite" class="boss-sprite"></div><img id="battleLuna" class="battle-luna" alt="전투 중인 루나"><span id="battleWand" class="battle-wand"></span><div class="hp-panel luna-hp"><b>LUNA</b><div class="hp-track"><span id="lunaHpFill" class="hp-fill"></span></div><span id="lunaHpText"></span></div></div><div id="battleLog" class="battle-log"></div><div class="battle-actions"><button id="wandAttack" class="battle-action primary">마법봉 공격<small id="wandAttackInfo"></small></button><button id="transformAttack" class="battle-action">변신 아이템<small id="transformAttackInfo"></small></button><button id="petSupport" class="battle-action">펫 지원<small id="petSupportInfo"></small></button><button id="battleRetry" class="battle-action" hidden>다시 도전</button></div></main></section>
<section id="game" class="screen game"><main class="game-shell">
  <header class="topbar"><div class="stats"><span>난이도<b id="levelText">고요</b></span><span>시간<b id="timer">00:00</b></span><span class="mistake-label">실수<b id="mistakes">0</b></span></div><button id="pause" class="icon-btn" aria-label="일시정지">Ⅱ</button></header>
  <div class="board-wrap"><div id="board" class="board" role="grid" aria-label="9 곱하기 9 스도쿠 보드"></div><div id="cover" class="board-cover"><div><strong>PAUSE</strong></div></div></div>
  <div id="message" class="message"></div>
  <div class="tools"><div class="utility"><button id="notes" class="tool">✎ 메모 OFF</button><button id="erase" class="tool">⌫ 지우기</button><button id="undo" class="tool">↶ 되돌리기</button><button id="hint" class="tool">✦ 힌트 <span id="hintCount">3</span></button></div><div id="numpad" class="numpad"></div></div>
</main></section>
<div id="pauseModal" class="modal"><div class="dialog"><h2>PAUSE</h2><div class="dialog-actions"><button id="continue" class="btn primary">계속하기</button><button id="restart" class="btn">처음부터 다시</button><button id="quit" class="btn ghost">타이틀로</button></div></div></div>
<div id="resultModal" class="modal"><div class="dialog"><div class="result-mark">✦</div><h2>별빛 퍼즐 완성!</h2><p id="resultStats"></p><div class="dialog-actions"><button id="again" class="btn primary">내 방으로</button><button id="resultTitle" class="btn ghost">타이틀로</button></div></div></div>
<div id="toast" class="toast"></div>
<script src="js/game.js"></script>
</body></html>
